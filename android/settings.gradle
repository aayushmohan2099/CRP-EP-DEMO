pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins {
    id("com.facebook.react.settings")
}

/**
 * Windows FIX:
 * Disable autolinking at settings.gradle level.
 * React Native will still autolink during build.gradle phase.
 */
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromConfigFile(
        file("${rootDir}/../react-native.config.js")
    )
}

rootProject.name = "enterprise_sakhi"
include(":app")
includeBuild("../node_modules/@react-native/gradle-plugin")
